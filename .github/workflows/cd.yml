name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Render
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    environment: production
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Trigger Render deploy for this commit
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl -fsS -X POST "${RENDER_DEPLOY_HOOK_URL}&ref=${SHA}"

      - name: Wait until the new version is live
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          for attempt in $(seq 1 60); do
            body=$(curl -fsS "${API_BASE_URL}/health/live" || true)
            if echo "$body" | grep -q "$SHA"; then
              echo "Live: $body"
              exit 0
            fi
            echo "Attempt $attempt: new version not live yet"
            sleep 15
          done
          echo "New version did not go live within 15 minutes"
          exit 1
