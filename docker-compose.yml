name: labaik

services:
  postgres:
    image: postgres:18
    container_name: labaik-postgres
    environment:
      POSTGRES_USER: labaik
      POSTGRES_PASSWORD: labaik_dev_only
      POSTGRES_DB: labaik
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labaik -d labaik"]
      interval: 5s
      timeout: 3s
      retries: 10

  seq:
    image: datalust/seq:latest
    container_name: labaik-seq
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports: ["5341:5341", "8081:80"]
    volumes: [seqdata:/data]

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    container_name: labaik-otel-dashboard
    environment:
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports: ["18888:18888", "4317:18889"]

  mailpit:
    image: axllent/mailpit:latest
    container_name: labaik-mailpit
    ports: ["8025:8025", "1025:1025"]

volumes:
  pgdata:
  seqdata:
